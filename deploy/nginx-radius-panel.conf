# Nginx local en el VPS: sirve web/dist (SPA) y proxya /api a la API Node.
# Escucha en localhost:80 en HTTP plano porque el HTTPS/dominio lo termina
# Nginx Proxy Manager por delante; este bloque solo atiende el trafico que
# NPM le reenvia. Ajusta "listen" si NPM esta configurado para reenviar a
# otro puerto de este VPS.
#
# Instalar como /etc/nginx/sites-available/radius-panel (ver README, seccion
# "Deploy automatico en el VPS").

server {
    listen 80;
    server_name _;

    root /opt/radius-panel/web/dist;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero real cae en index.html
    # (React Router hace el resto en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:1003/health;
    }

    # Descarga del firewall de la puerta de enlace VPN (GET
    # /vpn/gateway/firewall.nft, con su propio Bearer token, ver
    # services/vpnGatewayToken.ts). Montado fuera de /api a proposito (ver
    # server/src/index.ts). Imprescindible: deploy/vpn-gateway-agent.sh (VM
    # 192.168.10.29) exige HTTPS y esta es la unica ruta publica hasta la
    # API — no hay acceso LAN directo (ufw no deja pasar el puerto de la API
    # desde la .29, y aunque lo dejara seria HTTP sin cifrar para un token
    # que un admin puede usar para hacer aplicar reglas de firewall como
    # root en esa maquina). En Nginx Proxy Manager, restringe esta URL
    # publica a la IP de casa (donde estan la .28 y la .29).
    location /vpn/ {
        proxy_pass http://127.0.0.1:1003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No hay bloque "/pki/" aqui: la cadena de CA y la CRL (GET
    # /pki/ca-chain.pem, /pki/crl.pem) las consulta FreeRADIUS, que corre en
    # esta misma maquina (192.168.10.28) y accede por loopback
    # (http://127.0.0.1:1003/pki/...) sin pasar por este nginx ni por NPM —
    # ver "VPN y certificados" en el README. Si en el futuro algo externo
    # necesitara esa cadena por la URL publica, anade aqui un bloque igual
    # que el de "/vpn/" de arriba.
}
