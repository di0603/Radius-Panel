# Nginx local en el VPS: sirve web/dist (SPA) y proxya /api a la API Node.
# Escucha en localhost:80 en HTTP plano porque el HTTPS/dominio lo termina
# Nginx Proxy Manager por delante; este bloque solo atiende el trafico que
# NPM le reenvia. Ajusta "listen" si NPM esta configurado para reenviar a
# otro puerto de este VPS.
#
# Instalar como /etc/nginx/sites-available/radius-panel (ver README, seccion
# "Deploy automatico en el VPS").

server {
    listen 80;
    server_name _;

    root /opt/radius-panel/web/dist;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero real cae en index.html
    # (React Router hace el resto en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:1003/health;
    }

    # Modulo VPN: cadena de CA / CRL (sin auth, RFC 5280) y descarga del
    # firewall de la puerta de enlace (con su propio Bearer token, ver
    # services/vpnGatewayToken.ts). Montados fuera de /api a proposito (ver
    # server/src/index.ts); FreeRADIUS y deploy/vpn-gateway-agent.sh pueden
    # acceder por LAN directamente a 192.168.10.28:1003 sin pasar por aqui,
    # pero si se prefiere la URL publica hace falta este bloque tambien.
    location /pki/ {
        proxy_pass http://127.0.0.1:1003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vpn/ {
        proxy_pass http://127.0.0.1:1003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
