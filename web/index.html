<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de administracion para FreeRADIUS: usuarios, grupos, sesiones y NAS." />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Radius Panel</title>
    <script>
      // Aplica el esquema de color antes del primer pintado para evitar el flash blanco.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value') || 'auto';
          var dark =
            stored === 'dark' ||
            (stored === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
          document.documentElement.style.backgroundColor = dark ? '#0b0e15' : '#f5f6fa';
        } catch (e) {
          /* localStorage no disponible: Mantine lo resuelve al montar */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
